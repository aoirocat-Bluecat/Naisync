<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内線トランシーバー</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .id-box {
      background: #eef2f5;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      word-break: break-all;
      margin-bottom: 15px;
    }
    input, .btn-connect {
      font-size: 16px;
      padding: 12px;
      margin: 6px 0;
      width: 100%;
      box-sizing: border-box;
      border-radius: 8px;
    }
    input { border: 1px solid #ccc; text-align: center; }
    .btn-connect {
      background-color: #007bff;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .btn-connect:active { opacity: 0.8; }
    
    /* マイク操作エリアのレイアウト */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* 長押しトランシーバーボタン */
    #talk-btn {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      font-size: 18px;
      font-weight: bold;
      background-color: #cccccc;
      color: white;
      border: none;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    #talk-btn.active {
      background-color: #ff4444 !important;
      transform: scale(0.96);
    }

    /* ロック（切り替え）ボタン */
    #toggle-btn {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      border: 2px solid #cccccc;
      background-color: white;
      color: #666;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    /* ロック中（マイクON）のデザイン */
    #toggle-btn.locked {
      background-color: #ff4444;
      border-color: #ff4444;
      color: white;
    }

    #status {
      font-size: 13px;
      color: #666;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>内線トランシーバー</h2>
    
    <div>あなたの内線ID:</div>
    <div class="id-box" id="my-id">発行中...</div>
    
    <input type="text" id="peer-id-input" placeholder="相手の内線IDを入力">
    <button class="btn-connect" id="connect-btn">通話接続</button>

    <!-- 操作ボタンエリア -->
    <div class="controls">
      <!-- 1. 長押しボタン -->
      <button id="talk-btn" disabled>接続待ち</button>
      
      <!-- 2. 切り替え（トグル）ボタン -->
      <button id="toggle-btn" disabled>常時通話に切り替え (OFF)</button>
    </div>
    
    <div id="status">マイクの許可を待っています...</div>
  </div>

  <audio id="remote-audio" autoplay playsinline></audio>

  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <script>
    let peer;
    let localStream;
    let localAudioTrack;
    let wakeLock = null;
    let isLocked = false; // 常時通話（トグル）の状態を管理

    const myIdEl = document.getElementById('my-id');
    const peerIdInput = document.getElementById('peer-id-input');
    const connectBtn = document.getElementById('connect-btn');
    const statusEl = document.getElementById('status');
    const talkBtn = document.getElementById('talk-btn');
    const toggleBtn = document.getElementById('toggle-btn');
    const remoteAudio = document.getElementById('remote-audio');

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log('Wake Lock Error:', err);
      }
    }

    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then((stream) => {
        localStream = stream;
        localAudioTrack = stream.getAudioTracks()[0];
        localAudioTrack.enabled = false; 

        requestWakeLock();
        initPeer();
      })
      .catch((err) => {
        statusEl.innerText = 'マイクの使用を許可してください';
      });

    function initPeer() {
      peer = new Peer();
      peer.on('open', (id) => {
        myIdEl.innerText = id;
        statusEl.innerText = '相手のIDを入力して接続してください';
      });

      peer.on('call', (call) => {
        statusEl.innerText = '着信中... 接続しています';
        call.answer(localStream);
        setupCallListeners(call);
      });
    }

    connectBtn.addEventListener('click', () => {
      const targetId = peerIdInput.value.trim();
      if (!targetId) return alert('相手のIDを入力してください');
      
      statusEl.innerText = '接続中...';
      const call = peer.call(targetId, localStream);
      setupCallListeners(call);
    });

    function setupCallListeners(call) {
      call.on('stream', (remoteStream) => {
        remoteAudio.srcObject = remoteStream;
        statusEl.innerText = '接続完了！通話可能です';
        talkBtn.disabled = false;
        toggleBtn.disabled = false;
        talkBtn.innerText = '長押しで話す';
      });

      call.on('close', () => {
        statusEl.innerText = '通話が切断されました';
        talkBtn.disabled = true;
        toggleBtn.disabled = true;
      });
    }

    // ==========================================
    // マイクの制御（トランシーバー ＆ 切り替え）
    // ==========================================

    // 1. 長押しボタンの制御
    const startTalking = (e) => {
      e.preventDefault();
      // 常時通話ロック中は長押し処理を無視
      if (localAudioTrack && !talkBtn.disabled && !isLocked) {
        localAudioTrack.enabled = true;
        talkBtn.classList.add('active');
        talkBtn.innerText = '発言中!!';
      }
    };

    const stopTalking = (e) => {
      e.preventDefault();
      if (localAudioTrack && !talkBtn.disabled && !isLocked) {
        localAudioTrack.enabled = false;
        talkBtn.classList.remove('active');
        talkBtn.innerText = '長押しで話す';
      }
    };

    talkBtn.addEventListener('mousedown', startTalking);
    talkBtn.addEventListener('touchstart', startTalking);
    talkBtn.addEventListener('mouseup', stopTalking);
    talkBtn.addEventListener('touchend', stopTalking);
    talkBtn.addEventListener('mouseleave', stopTalking);

    // 2. 切り替え（トグル）ボタンの制御
    toggleBtn.addEventListener('click', () => {
      if (!localAudioTrack || toggleBtn.disabled) return;

      isLocked = !isLocked; // 状態を反転
      localAudioTrack.enabled = isLocked; // マイクのON/OFFを状態に合わせる

      if (isLocked) {
        // 常時通話ONの時の見た目
        toggleBtn.classList.add('locked');
        toggleBtn.innerText = '常時通話中 (ON) - タップでOFF';
        
        // 長押しボタンは使えないようにグレーアウト（視覚的な補助）
        talkBtn.classList.add('active');
        talkBtn.innerText = '常時通話中';
        talkBtn.style.opacity = '0.5';
      } else {
        // 常時通話OFFの時の見た目
        toggleBtn.classList.remove('locked');
        toggleBtn.innerText = '常時通話に切り替え (OFF)';
        
        // 長押しボタンを元の状態に戻す
        talkBtn.classList.remove('active');
        talkBtn.innerText = '長押しで話す';
        talkBtn.style.opacity = '1';
      }
    });

  </script>
</body>
</html>
