<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naisync - 超安定版 v3.0.0</title>
  <style>
    body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .card { background: white; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 360px; border-radius: 12px; text-align: center; }
    .title { font-size: 24px; font-weight: bold; color: #007bff; margin-bottom: 20px; }
    input { width: 100%; padding: 10px; margin: 5px 0 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .btn-danger { background: #dc3545; }
    .btn-secondary { background: #6c757d; }
    .info-box { background: #eef2f5; padding: 10px; border-radius: 6px; font-weight: bold; margin-bottom: 20px; word-break: break-all; font-size: 14px; }
    #talk-btn { width: 120px; height: 120px; border-radius: 50%; font-size: 16px; margin: 20px auto; display: block; background: #ccc; }
    #talk-btn.active { background: #ff4444; }
    .error-text { color: red; font-size: 12px; font-weight: bold; min-height: 15px; margin-bottom: 10px;}
  </style>
</head>
<body>

  <!-- ログイン画面 -->
  <div id="auth-view" class="card">
    <div class="title">Naisync</div>
    <div style="font-size: 12px; color: #666; margin-bottom: 15px;">※超安定版（機能縮小モデル）</div>
    
    <div id="login-form">
      <input type="text" id="login-id" placeholder="内線ID">
      <input type="password" id="login-pass" placeholder="パスワード">
      <div id="auth-error" class="error-text"></div>
      <button onclick="doLogin()" id="btn-login">ログイン</button>
      <button onclick="toggleForm()" class="btn-secondary">新規登録へ</button>
    </div>

    <div id="register-form" style="display: none;">
      <input type="text" id="reg-id" placeholder="希望する内線ID">
      <input type="text" id="reg-name" placeholder="表示名">
      <input type="password" id="reg-pass" placeholder="パスワード(6文字以上)">
      <div id="reg-error" class="error-text"></div>
      <button onclick="doRegister()" id="btn-reg">登録して開始</button>
      <button onclick="toggleForm()" class="btn-secondary">ログインへ戻る</button>
    </div>
  </div>

  <!-- メイン画面 -->
  <div id="main-view" class="card" style="display: none;">
    <div class="title">Naisync</div>
    
    <div style="text-align: left; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 5px;">あなたの情報</div>
    <div class="info-box">
      名前: <span id="my-name-display" style="color: #007bff;">-</span><br>
      ID: <span id="my-id-display">-</span>
    </div>

    <div id="status-display" style="color: red; font-size: 12px; font-weight: bold; margin-bottom: 15px;">通信サーバーに接続中...</div>

    <div style="text-align: left; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 5px;">発信先</div>
    <input type="text" id="target-id" placeholder="相手のIDを入力">
    <button onclick="callPeer()" id="btn-call" disabled>発信する</button>
    <button onclick="endCall()" id="btn-end" class="btn-danger" style="display: none;">通話を切る</button>

    <div id="call-status" style="margin-top: 15px; font-size: 14px; font-weight: bold;"></div>

    <button id="talk-btn" disabled>長押しで発言</button>

    <div style="margin-top: 20px; border-top: 1px solid #ccc; padding-top: 15px;">
      <button onclick="logout()" class="btn-secondary">ログアウト</button>
    </div>
  </div>

  <div id="audio-container" style="display: none;"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.1/peerjs.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Firebase設定 (既存のまま)
    const firebaseConfig = {
      apiKey: "AIzaSyDQT3tMY_btI--ZTeMlkb7I7EeVUCJZH80",
      authDomain: "naisync-b94a2.firebaseapp.com",
      projectId: "naisync-b94a2",
      storageBucket: "naisync-b94a2.firebasestorage.app",
      messagingSenderId: "816585211801",
      appId: "1:816585211801:web:0e5f27745d5c6979309d08",
      measurementId: "G-Q62SGVS646"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // グローバル変数
    let peer = null;
    let currentCall = null;
    let localStream = null;
    let audioTrack = null;
    let myName = '';
    let myCustomId = '';

    // ==========================================
    // UI制御ヘルパー
    // ==========================================
    const $ = id => document.getElementById(id);

    window.toggleForm = () => {
      const isLogin = $('login-form').style.display !== 'none';
      $('login-form').style.display = isLogin ? 'none' : 'block';
      $('register-form').style.display = isLogin ? 'block' : 'none';
      $('auth-error').innerText = '';
      $('reg-error').innerText = '';
    };

    // ==========================================
    // 認証処理 (Firebase)
    // ==========================================
    window.doRegister = async () => {
      const id = $('reg-id').value.trim().toLowerCase();
      const name = $('reg-name').value.trim();
      const pass = $('reg-pass').value.trim();

      if (!id || !name || !pass) return $('reg-error').innerText = '全て入力してください。';
      if (pass.length < 6) return $('reg-error').innerText = 'パスワードは6文字以上。';

      $('btn-reg').disabled = true;
      try {
        const userC = await createUserWithEmailAndPassword(auth, `${id}@naisy.nc`, pass);
        await updateProfile(userC.user, { displayName: JSON.stringify({ name, customId: id }) });
        alert('登録完了！');
      } catch (e) {
        $('reg-error').innerText = '登録失敗（ID重複など）。';
      }
      $('btn-reg').disabled = false;
    };

    window.doLogin = async () => {
      const id = $('login-id').value.trim().toLowerCase();
      const pass = $('login-pass').value.trim();
      if (!id || !pass) return $('auth-error').innerText = '入力してください。';

      $('btn-login').disabled = true;
      try {
        await signInWithEmailAndPassword(auth, `${id}@naisy.nc`, pass);
      } catch (e) {
        $('auth-error').innerText = 'IDかパスワードが違います。';
      }
      $('btn-login').disabled = false;
    };

    window.logout = async () => {
      if (confirm('ログアウトしますか？')) {
        await signOut(auth);
        location.reload();
      }
    };

    // ログイン状態の監視
    onAuthStateChanged(auth, user => {
      if (user) {
        try {
          const info = JSON.parse(user.displayName);
          myName = info.name;
          myCustomId = info.customId;
        } catch(e) {
          myCustomId = user.email.split('@')[0];
          myName = myCustomId;
        }
        initMainApp();
      } else {
        $('auth-view').style.display = 'block';
        $('main-view').style.display = 'none';
      }
    });

    // ==========================================
    // メインシステム起動 (マイクとPeerJS)
    // ==========================================
    async function initMainApp() {
      $('auth-view').style.display = 'none';
      $('main-view').style.display = 'block';
      $('my-name-display').innerText = myName;
      $('my-id-display').innerText = myCustomId;

      // 1. マイクの取得
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        audioTrack = localStream.getAudioTracks()[0];
        audioTrack.enabled = false; // 初期状態はミュート
        $('status-display').innerText = 'マイクOK。通信サーバーに接続中...';
      } catch (e) {
        alert('マイクが許可されませんでした。相手の声を聞くことはできますが、発言はできません。');
        localStream = new MediaStream(); // ダミー
        $('status-display').innerText = 'マイクなし。通信サーバーに接続中...';
      }

      // 2. PeerJSの起動
      peer = new Peer(myCustomId);

      peer.on('open', (id) => {
        $('status-display').innerText = '通信準備完了！';
        $('status-display').style.color = 'green';
        $('btn-call').disabled = false;
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          alert('このIDは現在別の端末で使用されています。');
        } else {
          $('status-display').innerText = '通信エラー: ' + err.type;
        }
      });

      // 着信処理
      peer.on('call', (call) => {
        if (currentCall) {
          // 通話中なら拒否
          call.close();
          return;
        }
        if (confirm(`${call.peer} から着信です。応答しますか？`)) {
          setupCall(call);
          call.answer(localStream);
        } else {
          call.close();
        }
      });
    }

    // ==========================================
    // 通話の制御
    // ==========================================
    window.callPeer = () => {
      const target = $('target-id').value.trim();
      if (!target) return alert('相手のIDを入力してください。');
      if (target === myCustomId) return alert('自分には発信できません。');
      
      $('call-status').innerText = '発信中...';
      const call = peer.call(target, localStream);
      setupCall(call);
    };

    window.endCall = () => {
      if (currentCall) {
        currentCall.close();
      }
      resetCallUI();
    };

    function setupCall(call) {
      currentCall = call;
      $('btn-call').style.display = 'none';
      $('target-id').style.display = 'none';
      $('btn-end').style.display = 'block';
      $('talk-btn').disabled = false;
      $('call-status').innerText = `${call.peer} と通話中`;

      call.on('stream', (remoteStream) => {
        let audio = $('remote-audio');
        if (!audio) {
          audio = document.createElement('audio');
          audio.id = 'remote-audio';
          audio.autoplay = true;
          $('audio-container').appendChild(audio);
        }
        audio.srcObject = remoteStream;
      });

      call.on('close', () => {
        alert('通話が終了しました。');
        resetCallUI();
      });
    }

    function resetCallUI() {
      currentCall = null;
      $('btn-call').style.display = 'block';
      $('target-id').style.display = 'block';
      $('btn-end').style.display = 'none';
      $('talk-btn').disabled = true;
      $('call-status').innerText = '';
      $('audio-container').innerHTML = '';
      if (audioTrack) audioTrack.enabled = false;
      $('talk-btn').classList.remove('active');
      $('talk-btn').innerText = '長押しで発言';
    }

    // ==========================================
    // PTTボタン (長押しで発言) の制御
    // ==========================================
    const btn = $('talk-btn');
    
    const startTalk = (e) => {
      e.preventDefault();
      if (!currentCall || !audioTrack) return;
      audioTrack.enabled = true;
      btn.classList.add('active');
      btn.innerText = '発言中...';
    };

    const stopTalk = (e) => {
      e.preventDefault();
      if (!currentCall || !audioTrack) return;
      audioTrack.enabled = false;
      btn.classList.remove('active');
      btn.innerText = '長押しで発言';
    };

    btn.addEventListener('mousedown', startTalk);
    btn.addEventListener('touchstart', startTalk, { passive: false });
    btn.addEventListener('mouseup', stopTalk);
    btn.addEventListener('touchend', stopTalk);
    btn.addEventListener('mouseleave', stopTalk);

  </script>
</body>
</html>
