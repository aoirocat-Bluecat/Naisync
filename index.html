<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多機能内線トランシーバー</title>
  <style>
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      min-height: 100vh; font-family: sans-serif; background-color: #f4f6f9; margin: 0;
    }
    
    /* タブ切り替えエリア（横スクロール対応） */
    .tabs-wrapper {
      width: 100%; max-width: 440px; background: #e0e0e0;
      display: flex; align-items: center; overflow-x: auto;
      padding: 8px 8px 0 8px; box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }
    .tabs-wrapper::-webkit-scrollbar { display: none; }

    .tab {
      padding: 12px 16px; font-weight: bold; font-size: 14px;
      background: #d0d0d0; color: #555; border: none; cursor: pointer;
      border-radius: 10px 10px 0 0; margin-right: 4px; white-space: nowrap;
      transition: 0.2s; flex-shrink: 0;
    }
    .tab.active { background: white; color: #007bff; }
    .tab-add { background: #007bff; color: white; border-radius: 8px; margin-left: auto; padding: 8px 12px; }

    .card {
      background: white; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 100%; max-width: 440px; text-align: center; box-sizing: border-box;
      flex-grow: 1; border-radius: 0 0 16px 16px;
    }

    .id-box {
      background: #eef2f5; padding: 10px; border-radius: 8px;
      font-weight: bold; word-break: break-all; margin: 10px 0 15px; font-size: 14px;
    }

    input, .btn-action {
      font-size: 15px; padding: 12px; margin: 6px 0; width: 100%;
      box-sizing: border-box; border-radius: 8px;
    }
    input { border: 1px solid #ccc; text-align: center; }
    .btn-action { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
    .btn-action:active { opacity: 0.8; }

    /* マイク操作エリア */
    .controls { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 20px; }
    
    #talk-btn {
      width: 160px; height: 160px; border-radius: 50%; font-size: 18px; font-weight: bold;
      background-color: #cccccc; color: white; border: none; box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      user-select: none; -webkit-user-select: none; touch-action: manipulation;
    }
    #talk-btn.active { background-color: #ff4444 !important; transform: scale(0.96); }

    #toggle-btn {
      width: 100%; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 8px;
      border: 2px solid #cccccc; background-color: white; color: #666; cursor: pointer;
    }
    #toggle-btn.locked { background-color: #ff4444; border-color: #ff4444; color: white; }

    #status { font-size: 14px; color: #333; margin-top: 10px; font-weight: bold; }
    #member-count { font-size: 12px; color: #888; margin-top: 4px; }
    .section-title { font-size: 12px; color: #777; text-align: left; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- タブヘッダー -->
  <div class="tabs-wrapper" id="tabs-wrapper">
    <!-- 動的にタブが生成されます -->
  </div>

  <div class="card">
    <!-- 自分のID表示 -->
    <div class="section-title">あなたの内線ID:</div>
    <div class="id-box" id="my-id">発行中...</div>

    <!-- 1対1通話用エリア -->
    <div id="direct-panel" style="display: none;">
      <input type="text" id="peer-id-input" placeholder="相手の内線IDを入力">
      <button class="btn-action" id="connect-btn">1対1で発信</button>
    </div>

    <!-- グループ通話用エリア -->
    <div id="group-panel" style="display: none;">
      <div id="member-count">接続中: 0人 (あなただけです)</div>
    </div>

    <!-- 共通ステータス表示 -->
    <div id="status">初期化中...</div>

    <!-- 共通マイク操作ボタン -->
    <div class="controls">
      <button id="talk-btn" disabled>準備中...</button>
      <button id="toggle-btn" disabled>常時通話に切り替え (OFF)</button>
    </div>
  </div>

  <div id="audio-container" style="display: none;"></div>

  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <script>
    const APP_SECRET = 'naisen-app-v3-';
    let myPeerId = null;
    let peer = null;
    let mqttClient = null;

    let currentMode = 'direct'; // 'direct' (1対1) または 'group' (グループ)
    let currentGroupId = null;
    let activeCalls = {};

    let localStream = null;
    let localAudioTrack = null;
    let isLocked = false;

    // 最初は空。自分で追加したグループのみ保存される
    let customGroups = JSON.parse(localStorage.getItem('my_naisen_groups')) || [];

    const tabsWrapper = document.getElementById('tabs-wrapper');
    const myIdEl = document.getElementById('my-id');
    const directPanel = document.getElementById('direct-panel');
    const groupPanel = document.getElementById('group-panel');
    const peerIdInput = document.getElementById('peer-id-input');
    const connectBtn = document.getElementById('connect-btn');
    const statusEl = document.getElementById('status');
    const countEl = document.getElementById('member-count');
    const talkBtn = document.getElementById('talk-btn');
    const toggleBtn = document.getElementById('toggle-btn');
    const audioContainer = document.getElementById('audio-container');

    // 1. 初期化
    async function init() {
      try {
        if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
        
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        localStream = stream;
        localAudioTrack = stream.getAudioTracks()[0];
        localAudioTrack.enabled = false;

        renderTabs();
        startNetworking();
      } catch (err) {
        statusEl.innerText = 'マイクの使用を許可してください';
      }
    }

    // 2. タブの描画
    function renderTabs() {
      tabsWrapper.innerHTML = '';

      // ① 1対1通話タブ（デフォルト）
      const directTab = document.createElement('button');
      directTab.className = `tab ${currentMode === 'direct' ? 'active' : ''}`;
      directTab.innerText = '1対1通話';
      directTab.onclick = () => switchToDirect();
      tabsWrapper.appendChild(directTab);

      // ② 自分で追加したグループタブ
      customGroups.forEach(g => {
        const tab = document.createElement('button');
        tab.className = `tab ${currentMode === 'group' && currentGroupId === g.id ? 'active' : ''}`;
        tab.innerText = g.name;
        tab.onclick = () => joinGroup(g.id, g.name);
        tabsWrapper.appendChild(tab);
      });

      // ③ グループ追加ボタン (+)
      const addBtn = document.createElement('button');
      addBtn.className = 'tab tab-add';
      addBtn.innerText = '＋ グループ作成';
      addBtn.onclick = createNewGroup;
      tabsWrapper.appendChild(addBtn);
    }

    // 3. ネットワーク接続
    function startNetworking() {
      peer = new Peer();
      peer.on('open', (id) => {
        myPeerId = id;
        myIdEl.innerText = id;

        mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        mqttClient.on('connect', () => {
          switchToDirect();
        });

        mqttClient.on('message', (topic, message) => {
          if (currentMode !== 'group') return;
          const data = JSON.parse(message.toString());
          if (data.type === 'join' && data.peerId !== myPeerId) {
            const call = peer.call(data.peerId, localStream);
            setupCall(call);
          }
        });
      });

      peer.on('call', (call) => {
        call.answer(localStream);
        setupCall(call);
      });
    }

    function setupCall(call) {
      if (activeCalls[call.peer]) return;
      activeCalls[call.peer] = call;
      updateStatus();

      call.on('stream', (remoteStream) => {
        if (!document.getElementById('audio-' + call.peer)) {
          const audio = document.createElement('audio');
          audio.id = 'audio-' + call.peer;
          audio.srcObject = remoteStream;
          audio.autoplay = true;
          audio.playsinline = true;
          audioContainer.appendChild(audio);
        }
      });

      call.on('close', () => {
        const audio = document.getElementById('audio-' + call.peer);
        if (audio) audio.remove();
        delete activeCalls[call.peer];
        updateStatus();
      });
    }

    function closeAllCalls() {
      if (currentGroupId && mqttClient) {
        mqttClient.unsubscribe(APP_SECRET + currentGroupId);
      }
      Object.values(activeCalls).forEach(call => call.close());
      activeCalls = {};
      audioContainer.innerHTML = '';
    }

    // --- モード切り替え ---

    function switchToDirect() {
      closeAllCalls();
      currentMode = 'direct';
      currentGroupId = null;

      renderTabs();
      directPanel.style.display = 'block';
      groupPanel.style.display = 'none';

      statusEl.innerText = '1対1モード: 相手のIDを入力してください';
      talkBtn.disabled = true;
      toggleBtn.disabled = true;
      talkBtn.innerText = '接続待ち';
    }

    connectBtn.addEventListener('click', () => {
      const targetId = peerIdInput.value.trim();
      if (!targetId) return alert('相手の内線IDを入力してください');
      statusEl.innerText = '発信中...';
      const call = peer.call(targetId, localStream);
      setupCall(call);
    });

    function joinGroup(groupId, groupName) {
      closeAllCalls();
      currentMode = 'group';
      currentGroupId = groupId;

      renderTabs();
      directPanel.style.display = 'none';
      groupPanel.style.display = 'block';

      mqttClient.subscribe(APP_SECRET + groupId);
      mqttClient.publish(APP_SECRET + groupId, JSON.stringify({ type: 'join', peerId: myPeerId }));

      statusEl.innerText = `【${groupName}】に参加中`;
      talkBtn.disabled = false;
      toggleBtn.disabled = false;
      talkBtn.innerText = '長押しで話す';
      updateStatus();
    }

    // 新規グループの作成
    function createNewGroup() {
      const groupName = prompt('追加するグループ名（例: 営業チーム, 雑談部屋 など）を入力してください:');
      if (!groupName) return;

      // グループ名に基づいて同じ部屋IDを作る（※同じ名前を入力した端末同士が繋がるようにする設定）
      const groupId = 'group-' + encodeURIComponent(groupName.trim().toLowerCase());
      
      // 既に存在していなければ追加
      if (!customGroups.some(g => g.id === groupId)) {
        customGroups.push({ id: groupId, name: groupName });
        localStorage.setItem('my_naisen_groups', JSON.stringify(customGroups));
      }

      // 作成したグループに移動
      joinGroup(groupId, groupName);
    }

    function updateStatus() {
      const count = Object.keys(activeCalls).length;
      if (currentMode === 'group') {
        countEl.innerText = count > 0 ? `接続中: ほか ${count} 人` : '接続中: 0人 (あなただけです)';
      } else if (currentMode === 'direct') {
        if (count > 0) {
          statusEl.innerText = '1対1通話中！';
          talkBtn.disabled = false;
          toggleBtn.disabled = false;
          talkBtn.innerText = '長押しで話す';
        } else {
          statusEl.innerText = '相手のIDを入力して発信してください';
        }
      }
    }

    // --- マイク操作（長押し＆切り替え） ---
    const startTalking = (e) => {
      e.preventDefault();
      if (localAudioTrack && !talkBtn.disabled && !isLocked) {
        localAudioTrack.enabled = true;
        talkBtn.classList.add('active');
        talkBtn.innerText = '発言中!!';
      }
    };

    const stopTalking = (e) => {
      e.preventDefault();
      if (localAudioTrack && !talkBtn.disabled && !isLocked) {
        localAudioTrack.enabled = false;
        talkBtn.classList.remove('active');
        talkBtn.innerText = '長押しで話す';
      }
    };

    talkBtn.addEventListener('mousedown', startTalking);
    talkBtn.addEventListener('touchstart', startTalking);
    talkBtn.addEventListener('mouseup', stopTalking);
    talkBtn.addEventListener('touchend', stopTalking);
    talkBtn.addEventListener('mouseleave', stopTalking);

    toggleBtn.addEventListener('click', () => {
      if (!localAudioTrack || toggleBtn.disabled) return;
      isLocked = !isLocked;
      localAudioTrack.enabled = isLocked;

      if (isLocked) {
        toggleBtn.classList.add('locked');
        toggleBtn.innerText = '常時通話中 (ON) - タップでOFF';
        talkBtn.classList.add('active');
        talkBtn.innerText = '常時通話中';
        talkBtn.style.opacity = '0.5';
      } else {
        toggleBtn.classList.remove('locked');
        toggleBtn.innerText = '常時通話に切り替え (OFF)';
        talkBtn.classList.remove('active');
        talkBtn.innerText = '長押しで話す';
        talkBtn.style.opacity = '1';
      }
    });

    init();
  </script>
</body>
</html>
